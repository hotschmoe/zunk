name: CI

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 19 * * *'
  workflow_dispatch:

env:
  ZIG_VERSION: "0.17.1"

jobs:
  test:
    if: github.event_name == 'pull_request'
    name: Test (${{ matrix.os }}, ${{ matrix.optimize }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        optimize: [Debug, ReleaseSafe]
        include:
          - os: ubuntu-latest
            optimize: ReleaseFast
          - os: ubuntu-latest
            optimize: ReleaseSmall

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build
        run: zig build -j4 -Doptimize=${{ matrix.optimize }} -Dcommit=${{ github.sha }}

      - name: Run Tests
        run: zig build test -j4 -Doptimize=${{ matrix.optimize }} -Dcommit=${{ github.sha }}

  format:
    if: github.event_name == 'pull_request'
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Check Formatting
        run: zig fmt --check src/

  heavy:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - run: zig build fuzz-heavy -j4 -Dcommit=${{ github.sha }}
      - run: zig build test-heavy -j4 -Dcommit=${{ github.sha }}

